name: core

on:
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]
  push:
    branches: [main]
    paths: ["core/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest -q
