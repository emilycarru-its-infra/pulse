name: core

on:
  pull_request:
    paths: ["core/**", "products/**", "hub/**", ".github/workflows/core.yml"]
  push:
    branches: [main]
    paths: ["core/**", "products/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest -q

  computers-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e core -e 'products/computers/api[test]'
      - run: pytest -q products/computers/api

  servers-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'products/servers/api[test]'
      - run: pytest -q products/servers/api
      - run: node --check products/servers/web/servers.js
      - run: node --test products/servers/api/tests/web/*.test.cjs

  websites-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'products/websites/api[test]'
      - run: pytest -q products/websites/api
      - run: node --check products/websites/web/websites.js
      - run: node --test products/websites/api/tests/web/*.test.cjs

  printers-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e core -e 'products/printers/api[test]'
      - run: pytest -q products/printers/api

  software-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e core -e products/computers/api -e 'products/software/api[test]'
      - run: pytest -q products/software/api
      - run: node --check products/software/web/software.js

  windows-agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: products/computers/agents/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/PulseAgent.Core.Tests --verbosity minimal
      - run: dotnet build src/PulseAgent.Cli --configuration Release
      - run: dotnet build src/PulseAgent.Idle --configuration Release
      - run: dotnet build src/PulseAgent.App --configuration Release --runtime win-x64

  terraform-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/terraform/pulse-product
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false -input=false
      - run: terraform fmt -check
      - run: terraform validate
      - run: terraform test -no-color
