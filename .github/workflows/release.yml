# Build and publish the ComputerPulse agents as a GitHub release.
#
# The artifacts are UNSIGNED on purpose: no signing identity lives in this repo, so this
# workflow only compiles and zips. A deploying organization fetches the release, signs it and
# packages it in its own pipeline:
#   ComputerPulse-App-<version>.zip  the Mac app, Managed Presence Beacon.app, with the
#                                    managedpulse CLI and the prefs helper inside it
#   computerpulse-<arch>.zip         the Windows install folder (x64 and arm64): managedpulse.exe,
#                                    the idle helper, Managed Presence Beacon.exe and its runtime,
#                                    names.json and the install scripts
# The Windows package definition, build-info.yaml and scripts/, sits beside the Windows source.
#
# Triggered by pushing a v* tag (v2026.10.12.1100), or by hand, which builds without releasing.

name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then v="${REF_NAME#v}"; else v="$(TZ=America/Vancouver date '+%Y.%m.%d.%H%M')"; fi
          echo "$v" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$' || { echo "Tag must be vYYYY.MM.DD.HHMM, got $REF_NAME"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    runs-on: macos-26
    defaults:
      run:
        working-directory: products/computers/agents/mac
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
      - run: make app VERSION=${{ needs.version.outputs.version }}
      - name: Zip the unsigned app
        run: |
          mkdir -p out
          ditto -c -k --keepParent "build/root/Applications/Utilities/Managed Presence Beacon.app" \
            "out/ComputerPulse-App-${{ needs.version.outputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: products/computers/agents/mac/out/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: products/computers/agents/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: ./build.ps1 -Architecture both -Test -Version ${{ needs.version.outputs.version }}
      - name: Zip each install folder
        run: |
          New-Item -ItemType Directory out -Force | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            Compress-Archive -Path "publish/$arch/*" -DestinationPath "out/computerpulse-$arch.zip" -Force
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "out/computerpulse-$arch.zip").Path)
            try {
              foreach ($required in 'managedpulse.exe', 'managedpulse-idle.exe', 'Managed Presence Beacon.exe', 'resources.pri', 'names.json', 'install.ps1') {
                if (-not ($zip.Entries | Where-Object FullName -eq $required)) { throw "computerpulse-$arch.zip is missing $required" }
              }
            } finally { $zip.Dispose() }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: products/computers/agents/windows/out/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --generate-notes --title "ComputerPulse $TAG" -R "$GITHUB_REPOSITORY"
          fi
