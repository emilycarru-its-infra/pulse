[project]
name = "pulse-core"
version = "0.1.0"
description = "Shared contract code for Pulse products"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
test = ["pytest", "jsonschema"]

[tool.setuptools.packages.find]
include = ["pulse_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
