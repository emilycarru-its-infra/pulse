kind = "lab"
building = "A"
floor = "1"
floorplan = "floorplans/a1.svg"
match = { group = "Open Mac Lab", locations = ["A1100"] }
out_of_service = ["LAB-MAC-03"]

[spaces.seats]
"LAB-MAC-01" = [120, 340]
"LAB-MAC-02" = [160, 340]
