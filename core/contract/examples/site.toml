[inventory]
provider = "snipeit"
url = "https://inventory.example.edu/api/v1"
categories = ["Desktop", "Laptop"]

[inventory.fields]
hostname_field = "Hostname"
platform_field = "Platform"
group_field = "Fleet"

[[spaces]]
id = "open-mac-lab"
