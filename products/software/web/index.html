<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software</title>
  <link rel="stylesheet" href="/theme/tokens.css">
  <link rel="stylesheet" href="/core/base.css">
  <link rel="stylesheet" href="software.css">
</head>
<body class="app">
  <main class="doc wide">
    <p id="notice" role="status">Loading software…</p>
    <section id="browse" aria-label="Software catalog">
      <div class="catalog-toolbar">
        <label class="search-label" for="search">Find software<input type="search" id="search" placeholder="Search software" autocomplete="off"></label>
        <label for="category">Category<select id="category"><option value="">All categories</option></select></label>
        <label for="platform">Platform<select id="platform"><option value="">Mac and Windows</option><option value="mac">Mac</option><option value="windows">Windows</option></select></label>
        <p id="result-count" aria-live="polite"></p>
      </div>
      <div id="software-list" class="software-list"></div>
      <p id="empty" hidden>No software matches your search.</p>
    </section>
    <section id="detail" hidden aria-labelledby="software-title">
      <a class="back" href="#">← All software</a>
      <div class="software-heading"><div id="detail-icon"></div><div><p id="detail-category" class="eyebrow"></p><h2 id="software-title" tabindex="-1"></h2><p id="detail-platforms"></p></div></div>
      <div class="location-heading"><div><h3>Where to find it</h3><p id="location-count"></p></div><label for="version">Version<select id="version"><option value="">All versions</option></select></label></div>
      <div id="locations" class="locations"></div>
      <p id="no-locations" hidden>No recent installation reports for this software on shared campus computers.</p>
      <p class="availability-note">Free means likely unattended. Licence availability is not yet connected.</p>
    </section>
  </main>
  <script src="/core/shell.js"></script>
  <script src="software.js"></script>
</body>
</html>
