[project]
name = "pulse-software"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pulse-computers", "azure-functions", "azure-identity", "azure-data-tables", "azure-storage-blob>=12.20"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["pulse_software*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
