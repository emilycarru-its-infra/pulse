<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Status</title>
  <link rel="stylesheet" href="/theme/tokens.css">
  <link rel="stylesheet" href="/core/base.css">
  <link rel="stylesheet" href="/core/technologies.css">
  <link rel="stylesheet" href="servers.css">
</head>
<body>
  <main class="doc wide">
    <p class="sample" id="sample" hidden><b>Mockup with sample data.</b> The servers and services are real names; every status, metric and alert on this page is simulated.</p>

    <div class="toolbar">
      <div class="segmented" role="group" aria-label="Group by" id="view">
        <button type="button" data-v="location" aria-pressed="true">By location</button>
        <button type="button" data-v="service" aria-pressed="false">By service</button>
      </div>
      <button type="button" id="patching-toggle" aria-pressed="false">Patching</button>
      <label class="runtime-filter patch-filter" hidden><span class="visually-hidden">Kernel advisory</span><select id="cve"></select></label>
      <label class="runtime-filter patch-filter" hidden><span class="visually-hidden">Patch status</span><select id="patch-state"><option value="">All patch states</option><option value="needs_patch">Needs patch</option><option value="restart_required">Restart required</option><option value="awaiting_vendor_fix">Awaiting vendor fix</option><option value="verified_fixed">Verified fixed</option><option value="not_affected">Not affected</option><option value="unknown">Unknown / stale</option></select></label>
      <div class="segmented" role="group" aria-label="Show" id="filter">
        <button type="button" data-v="degraded" aria-pressed="false">Warning</button>
        <button type="button" data-v="down" aria-pressed="false">Error</button>
        <button type="button" data-v="unknown" aria-pressed="false">Not reporting</button>
      </div>
      <label class="runtime-filter"><span class="visually-hidden">Platform</span>
        <select id="platform"><option value="">All platforms</option></select>
      </label>
      <label class="runtime-filter os-filter"><span class="visually-hidden">OS version</span>
        <select id="os"><option value="">All OS versions</option></select>
      </label>
      <label class="runtime-filter"><span class="visually-hidden">Binary</span>
        <select id="binary"><option value="">All binaries</option></select>
      </label>
      <label class="search"><span class="visually-hidden">Find a server</span>
        <input type="search" id="search" placeholder="Find server, service, binary or version" autocomplete="off" spellcheck="false">
      </label>
      <button type="button" id="clear-filters" class="clear-filters" hidden>Clear Filters</button>
      <span id="filter-link" class="filter-link"></span>
      <div class="toolbar-end">
        <p class="total" id="total" aria-live="polite"></p>
      </div>
    </div>

    <section id="patching-overview" class="patching-overview" hidden aria-label="Kernel patching coverage"></section>
    <section id="runtime-overview" class="runtime-overview" aria-label="Binary observation coverage"></section>

    <section class="picture" aria-label="Where the servers run" id="picture"></section>

    <div class="stage">
      <div class="groups" id="groups"></div>
    </div>

    <div class="page-foot">
      <ul class="legend" aria-label="Legend">
        <li><span class="tag up"></span>Up</li>
        <li><span class="tag degraded"></span>Warning</li>
        <li><span class="tag down"></span>Error</li>
        <li><span class="tag stopped"></span>Stopped on purpose</li>
        <li><span class="tag unknown"></span>Not reporting</li>
      </ul>
      <p class="fine" id="updated"></p>
    </div>
  </main>
  <script src="/core/shell.js"></script>
  <script src="/core/technologies.js"></script>
  <script src="/core/masonry.js"></script>
  <script src="servers.js"></script>
</body>
</html>
