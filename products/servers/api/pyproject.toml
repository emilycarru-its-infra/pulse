[project]
name = "pulse-servers"
version = "0.1.0"
description = "ServersPulse API, sample source and local dev server"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
azure = ["azure-functions"]
test = ["pytest", "azure-functions"]

[tool.setuptools.packages.find]
include = ["pulse_servers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
